name: Daily Random Auto Commit

on:
  schedule:
    # Runs every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Random Commits or Skip Day
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 20% chance to skip today completely (1 in 5 chance)
          if [ $(( RANDOM % 5 )) -eq 0 ]; then
            echo "Skipping today to mimic natural user behavior!"
            exit 0
          fi

          # Pick a random number of commits between 3 and 8
          NUM_COMMITS=$(( RANDOM % 6 + 3 ))
          echo "Generating $NUM_COMMITS commits today..."

          for (( i=1; i<=NUM_COMMITS; i++ ))
          do
            echo "Automated update $i/$NUM_COMMITS on $(date -u)" >> streak.txt
            git add streak.txt
            git commit -m "chore: activity boost $i/$NUM_COMMITS [skip ci]"
          done

          git push
